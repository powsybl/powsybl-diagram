<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" font-family="sans-serif" font-size="13">
  <text x="10" y="20" font-size="14" font-weight="bold">A BSCluster with 3 HorizontalBusList (one per busBarIndex v)</text>

  <!-- column headers: VerticalBusSet positions -->
  <text x="140" y="45" text-anchor="middle" font-size="11" fill="#555555">position 0</text>
  <text x="240" y="45" text-anchor="middle" font-size="11" fill="#555555">position 1</text>
  <text x="340" y="45" text-anchor="middle" font-size="11" fill="#555555">position 2</text>
  <text x="440" y="45" text-anchor="middle" font-size="11" fill="#555555">position 3</text>

  <!-- v=0 row : startingIndex=0, length=3, three distinct BusNode -->
  <text x="10" y="80" font-size="11">v=0</text>
  <rect x="90" y="60" width="100" height="34" fill="#f2e6ff" stroke="#6a2ea8"/>
  <text x="140" y="82" text-anchor="middle">BusNode D</text>
  <rect x="190" y="60" width="100" height="34" fill="#f2e6ff" stroke="#6a2ea8"/>
  <text x="240" y="82" text-anchor="middle">BusNode E</text>
  <rect x="290" y="60" width="100" height="34" fill="#f2e6ff" stroke="#6a2ea8"/>
  <text x="340" y="82" text-anchor="middle">BusNode F</text>

  <!-- v=1 row : startingIndex=0, length=4, with a null gap at position 1 -->
  <text x="10" y="130" font-size="11">v=1</text>
  <rect x="90" y="110" width="100" height="34" fill="#eefbf0" stroke="#2a8a3d"/>
  <text x="140" y="132" text-anchor="middle">BusNode B</text>
  <rect x="190" y="110" width="100" height="34" fill="#f5f5f5" stroke="#999999" stroke-dasharray="3 2"/>
  <text x="240" y="132" text-anchor="middle" fill="#999999">null</text>
  <rect x="290" y="110" width="200" height="34" fill="#fde9cf" stroke="#b06a11"/>
  <text x="390" y="132" text-anchor="middle">BusNode C</text>

  <!-- v=2 row : startingIndex=1, length=2, single BusNode spanning both positions -->
  <text x="10" y="180" font-size="11">v=2</text>
  <rect x="90" y="160" width="200" height="34" fill="#dbe9ff" stroke="#2255aa"/>
  <text x="190" y="182" text-anchor="middle">BusNode A</text>
</svg>


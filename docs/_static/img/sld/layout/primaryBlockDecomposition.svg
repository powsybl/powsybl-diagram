                <g class="sld-feeder-info sld-in sld-active-power" id="idFEEDER_95_ARROW_95_ACTIVE" transform="matrix(0.0,-1.0,1.0,0.0,370.0,345.0)">
                    <polygon class="sld-arrow-out" points="5,0 10,10 0,10"/>
                    <polygon class="sld-arrow-in" points="0,0 10,0 5,10"/>
                </g>
                <g class="sld-feeder-info sld-in sld-reactive-power" id="idFEEDER_95_ARROW_95_REACTIVE" transform="matrix(0.0,-1.0,1.0,0.0,350.0,345.0)">

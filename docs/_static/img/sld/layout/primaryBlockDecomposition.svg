<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" font-family="sans-serif" font-size="13">
  <text x="10" y="20" font-size="14" font-weight="bold">Cell graph, overlaid with the resulting primary blocks (step 1)</text>

  <!-- ===== nodes ===== -->
  <!-- BUS1 -->
  <rect x="20" y="65" width="70" height="26" fill="#dbe9ff" stroke="#2255aa"/>
  <text x="55" y="83" text-anchor="middle">BUS1</text>
  <!-- SWITCH a -->
  <rect x="130" y="67" width="60" height="22" fill="#ffffff" stroke="#333333"/>
  <text x="160" y="82" text-anchor="middle" font-size="11">SWITCH</text>
  <!-- FICTITIOUS fork -->
  <circle cx="290" cy="78" r="14" fill="#eeeeee" stroke="#333333"/>
  <text x="290" y="121" text-anchor="middle" font-size="11">FICTITIOUS (fork)</text>

  <!-- SWITCH b -->
  <rect x="360" y="67" width="60" height="22" fill="#ffffff" stroke="#333333"/>
  <text x="390" y="82" text-anchor="middle" font-size="11">SWITCH</text>
  <!-- BUS2 -->
  <rect x="450" y="65" width="70" height="26" fill="#dbe9ff" stroke="#2255aa"/>
  <text x="485" y="83" text-anchor="middle">BUS2</text>

  <!-- FEEDER, directly connected to the fork (no switch in between) -->
  <rect x="255" y="165" width="70" height="26" fill="#fde9cf" stroke="#b06a11"/>
  <text x="290" y="183" text-anchor="middle">FEEDER</text>

  <!-- edges -->
  <line x1="90" y1="78" x2="130" y2="78" stroke="#333333"/>
  <line x1="190" y1="78" x2="276" y2="78" stroke="#333333"/>
  <line x1="304" y1="78" x2="360" y2="78" stroke="#333333"/>
  <line x1="420" y1="78" x2="450" y2="78" stroke="#333333"/>
  <line x1="290" y1="92" x2="290" y2="165" stroke="#333333"/>

  <!-- ===== overlaid primary blocks: each box exactly spans the nodes it contains ===== -->
  <!-- LegPrimaryBlock 1: BUS1 - SWITCH - FICTITIOUS(fork) -->
  <rect x="10" y="53" width="300" height="46" rx="6" fill="none" stroke="#2255aa" stroke-width="2" stroke-dasharray="7 3"/>
  <text x="12" y="47" font-size="11" fill="#2255aa">LegPrimaryBlock: BUS1 - SWITCH - FICTITIOUS(fork)</text>

  <!-- LegPrimaryBlock 2: FICTITIOUS(fork) - SWITCH - BUS2 -->
  <rect x="270" y="59" width="258" height="46" rx="6" fill="none" stroke="#2255aa" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="523" y="118" text-anchor="end" font-size="11" fill="#2255aa">LegPrimaryBlock:</text>
  <text x="523" y="132" text-anchor="end" font-size="11" fill="#2255aa">FICTITIOUS(fork) - SWITCH - BUS2</text>

  <!-- FeederPrimaryBlock: FICTITIOUS(fork) - FEEDER (no switch) -->
  <rect x="247" y="55" width="86" height="144" rx="6" fill="none" stroke="#b06a11" stroke-width="2" stroke-dasharray="7 3"/>
  <text x="337" y="175" font-size="11" fill="#b06a11">FeederPrimaryBlock:</text>
  <text x="337" y="189" font-size="11" fill="#b06a11">FICTITIOUS(fork) - FEEDER</text>

  <!-- ===== exhaustive legend ===== -->
  <text x="10" y="215" font-size="11" fill="#555555">The 3 dashed boxes are the resulting primary blocks: 2 LegPrimaryBlock (blue) and 1</text>
  <text x="10" y="229" font-size="11" fill="#555555">FeederPrimaryBlock (orange).</text>
  <text x="10" y="247" font-size="11" fill="#555555">The FICTITIOUS fork node is shared: it belongs to all 3 primary blocks (its cardinality is 3).</text>
  <text x="10" y="261" font-size="11" fill="#555555">Every other node (BUS1, BUS2, FEEDER, both SWITCH) belongs to exactly one primary block.</text>

  <rect x="10" y="277" width="16" height="12" fill="none" stroke="#2255aa" stroke-width="2" stroke-dasharray="4 2"/>
  <text x="32" y="287" font-size="11" fill="#333333">LegPrimaryBlock (BUS - n*SWITCH - FICTITIOUS)</text>
  <rect x="300" y="277" width="16" height="12" fill="none" stroke="#b06a11" stroke-width="2" stroke-dasharray="4 2"/>
  <text x="322" y="287" font-size="11" fill="#333333">FeederPrimaryBlock (FICTITIOUS - FEEDER)</text>
</svg>

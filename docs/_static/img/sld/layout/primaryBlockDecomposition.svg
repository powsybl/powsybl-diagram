<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" font-family="sans-serif" font-size="13">

  <!-- ===== nodes ===== -->
  <!-- BUS1 -->
  <rect x="10" y="33" width="70" height="26" fill="#dbe9ff" stroke="#2255aa"/>
  <text x="45" y="51" text-anchor="middle">BUS1</text>

  <!-- BUS2 -->
  <rect x="10" y="138" width="70" height="26" fill="#dbe9ff" stroke="#2255aa"/>
  <text x="45" y="156" text-anchor="middle">BUS2</text>

  <!-- SWITCH a1 (top leg, on BUS1) -->
  <rect x="140" y="35" width="60" height="22" fill="#ffffff" stroke="#333333"/>
  <text x="170" y="50" text-anchor="middle" font-size="11">SWITCH</text>

  <!-- SWITCH a2 (bottom leg, on BUS2) -->
  <rect x="140" y="140" width="60" height="22" fill="#ffffff" stroke="#333333"/>
  <text x="170" y="155" text-anchor="middle" font-size="11">SWITCH</text>

  <!-- FICTITIOUS fork F1 -->
  <circle cx="250" cy="98" r="14" fill="#eeeeee" stroke="#333333"/>
  <text x="250" y="141" text-anchor="middle" font-size="11">FICTITIOUS</text>

  <!-- SWITCH b (body) -->
  <rect x="300" y="87" width="60" height="22" fill="#ffffff" stroke="#333333"/>
  <text x="330" y="102" text-anchor="middle" font-size="11">SWITCH</text>

  <!-- FICTITIOUS F2 -->
  <circle cx="400" cy="98" r="14" fill="#eeeeee" stroke="#333333"/>
  <text x="400" y="141" text-anchor="middle" font-size="11">FICTITIOUS</text>

  <!-- FEEDER, directly connected to F2 (no switch in between) -->
  <rect x="450" y="85" width="70" height="26" fill="#fde9cf" stroke="#b06a11"/>
  <text x="485" y="103" text-anchor="middle">FEEDER</text>

  <!-- ===== edges ===== -->
  <line x1="80" y1="46" x2="140" y2="46" stroke="#333333"/>
  <line x1="80" y1="151" x2="140" y2="151" stroke="#333333"/>
  <line x1="200" y1="46" x2="236" y2="98" stroke="#333333"/>
  <line x1="200" y1="151" x2="236" y2="98" stroke="#333333"/>
  <line x1="264" y1="98" x2="300" y2="98" stroke="#333333"/>
  <line x1="360" y1="98" x2="386" y2="98" stroke="#333333"/>
  <line x1="414" y1="98" x2="450" y2="98" stroke="#333333"/>

  <!-- ===== overlaid primary blocks: each box exactly spans the nodes it contains ===== -->
  <!-- LegPrimaryBlock 1: BUS1 - SWITCH a1 - FICTITIOUS(fork) -->
  <rect x="5" y="25" width="267" height="93" rx="6" fill="none" stroke="#2255aa" stroke-width="2" stroke-dasharray="7 3"/>

  <!-- LegPrimaryBlock 2: BUS2 - SWITCH a2 - FICTITIOUS(fork) -->
  <rect x="5" y="78" width="267" height="93" rx="6" fill="none" stroke="#2255aa" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- LegParallelBlock: merge of LegPrimaryBlock 1 and 2, sharing the FICTITIOUS(fork) node; BUS1 and BUS2 are two distinct BusNode instances, but they are still considered "similar" extremities (both are BusNode) for the parallel-merge criterion -->
  <rect x="0" y="18" width="278" height="160" rx="8" fill="none" stroke="#2a8a3d" stroke-width="2" stroke-dasharray="10 4"/>

  <!-- BodyPrimaryBlock: FICTITIOUS(fork) - SWITCH - FICTITIOUS -->
  <rect x="228" y="80" width="194" height="45" rx="6" fill="none" stroke="#7a3aab" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- FeederPrimaryBlock: FICTITIOUS - FEEDER (no switch) -->
  <rect x="378" y="82" width="150" height="41" rx="6" fill="none" stroke="#b06a11" stroke-width="2" stroke-dasharray="7 3"/>

  <!-- ===== legend ===== -->
  <rect x="10" y="220" width="16" height="12" fill="none" stroke="#2255aa" stroke-width="2" stroke-dasharray="4 2"/>
  <text x="32" y="230" font-size="11" fill="#333333">LegPrimaryBlock (BUS - n*SWITCH - FICTITIOUS)</text>
  <rect x="10" y="237" width="16" height="12" fill="none" stroke="#2a8a3d" stroke-width="2" stroke-dasharray="6 2"/>
  <text x="32" y="247" font-size="11" fill="#333333">LegParallelBlock (LegPrimaryBlocks sharing both extremities: fork node + any BusNode)</text>
  <rect x="10" y="254" width="16" height="12" fill="none" stroke="#7a3aab" stroke-width="2" stroke-dasharray="4 2"/>
  <text x="32" y="264" font-size="11" fill="#333333">BodyPrimaryBlock (FICTITIOUS - n*SWITCH - FICTITIOUS)</text>
  <rect x="10" y="271" width="16" height="12" fill="none" stroke="#b06a11" stroke-width="2" stroke-dasharray="4 2"/>
  <text x="32" y="281" font-size="11" fill="#333333">FeederPrimaryBlock (FICTITIOUS - FEEDER)</text>
</svg>

                </g>
                <g class="sld-node sld-fictitious sld-vl300to500 sld-bus-0" id="idINTERNAL_95_VL_95_2" transform="translate(201.0,336.0)">
                    <circle cx="4" cy="4" r="4"/>
                </g>
                <g class="sld-disconnector sld-closed sld-vl300to500 sld-bus-0" id="idSWITCH_95_A2" transform="translate(141.0,376.0)">

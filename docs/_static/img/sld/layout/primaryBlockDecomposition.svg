                </g>
                <g class="sld-disconnector sld-closed sld-vl300to500 sld-bus-0" id="idSWITCH_95_B" transform="translate(261.0,336.0)">
                    <path class="sld-sw-closed" d="M0,0 8,8 M8,0 0,8"/>

                </g>
                <g class="sld-node sld-fictitious sld-vl300to500 sld-bus-0" id="idINTERNAL_95_VL_95_FEEDER" transform="translate(321.0,336.0)">
                    <circle cx="4" cy="4" r="4"/>
                </g>
                <g class="sld-load sld-top-feeder sld-vl300to500 sld-bus-0" id="idFEEDER" transform="translate(387.0,335.5)">
                    <rect height="9" width="16"/>
                    <line x1="0" x2="16" y1="0" y2="9"/>
                    <line x1="16" x2="0" y1="0" y2="9"/>

                </g>
                <g class="sld-disconnector sld-closed sld-vl300to500 sld-bus-0" id="idSWITCH_95_A1" transform="translate(141.0,296.0)">
                    <path class="sld-sw-closed" d="M0,0 8,8 M8,0 0,8"/>
